<style>
:root{--bg:#f6f1e4;--ink:#16140f;--accent:#f5c400;--accent-d:#c79a00;--card:#ece5d2;--mute:#5d574a;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:17px}
h1,h2,h3{font-family:'Fraunces',serif;line-height:1.1}
a{color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
section{padding:90px 0}
h2{font-size:clamp(30px,5vw,46px);margin-bottom:12px}
.sub{color:var(--mute);max-width:560px;margin-bottom:36px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:800;text-decoration:none;border:2px solid var(--ink);font-size:15px}
.btn.fill{background:var(--accent);color:var(--ink)}
.btn.out{background:transparent}
.btn.dark{background:var(--ink);color:var(--accent)}
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:2px solid var(--ink)}
.hd{display:flex;align-items:center;gap:14px;height:66px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:'Fraunces',serif;font-weight:800;font-size:20px}
.logo img{width:38px;height:38px;border-radius:50%;border:2px solid var(--ink)}
nav{display:flex;gap:20px;margin-left:auto;font-weight:600;font-size:15px}
nav a{text-decoration:none}nav a:hover{color:var(--accent-d)}
.hb{display:flex;gap:8px}.hb .btn{padding:8px 14px;font-size:14px}
.burger{display:none;background:none;border:2px solid var(--ink);border-radius:8px;width:42px;height:38px;font-size:20px;cursor:pointer}
.hero{padding:70px 0 90px;background:var(--bg)}
.hg{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(36px,6vw,62px);font-weight:800;margin-bottom:18px}
.hero h1 em{background:var(--accent);font-style:normal;padding:0 8px}
.proof{font-weight:600;color:var(--mute);margin-bottom:26px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.hv{position:relative;transform:rotate(2deg)}
.hv img.main{border-radius:var(--r);border:3px solid var(--ink);box-shadow:10px 10px 0 var(--accent)}
.hv svg{position:absolute;left:-26px;top:-26px;width:60px}
.trust{background:var(--ink);color:var(--bg);padding:44px 0}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;text-align:left}
.tg b{font-family:'Fraunces',serif;font-size:40px;color:var(--accent);display:block;line-height:1}
.tg span{font-size:14px}
.sg{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:10px}
.card.big{grid-column:span 4;background:var(--accent)}
.card.sm{grid-column:span 2}
.card.md{grid-column:span 3}
.card h3{font-size:24px}
.price{font-weight:800}
.card .btn{margin-top:auto;align-self:flex-start;padding:10px 18px;font-size:14px}
.card svg{width:34px;height:34px}
.about{background:var(--card);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.ag{display:grid;grid-template-columns:.7fr 1.3fr;gap:50px;align-items:start}
.av{width:150px;height:150px;border-radius:50%;background:var(--ink);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:56px;font-weight:800;border:4px solid var(--accent);outline:2px solid var(--ink);margin-bottom:16px}
.about p{margin-bottom:14px}
.diff{list-style:none;margin-top:20px;display:grid;gap:8px}
.diff li{padding-left:26px;position:relative;font-weight:600}
.diff li:before{content:"⚡";position:absolute;left:0}
.gal{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.gal img{width:100%;height:100%;object-fit:cover;border-radius:var(--r);border:2px solid var(--ink)}
.g1{grid-column:span 4;aspect-ratio:16/9}.g2{grid-column:span 2;aspect-ratio:1}.g3{grid-column:span 2;aspect-ratio:1}.g4{grid-column:span 4;aspect-ratio:16/9}
.break{margin:0 calc(50% - 50vw);background:var(--accent);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:30px 20px;font-family:'Fraunces',serif;font-weight:800;font-size:clamp(26px,5vw,54px);text-align:right;overflow:hidden;white-space:nowrap}
.tm{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px;align-items:start}
.tm blockquote{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:22px}
.tm blockquote:nth-child(2){margin-top:34px}
.stars{display:flex;gap:2px;margin-bottom:8px}.stars svg{width:18px;height:18px}
.tm cite{display:block;margin-top:10px;font-style:normal;font-weight:800;font-size:14px}
.pl{max-width:640px;list-style:none;border-top:2px solid var(--ink)}
.pl li{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px dashed var(--mute);font-weight:600}
.pl li b{font-family:'Fraunces',serif;font-size:19px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:34px}
iframe{width:100%;height:320px;border:2px solid var(--ink);border-radius:var(--r);filter:sepia(.25)}
.hrs{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin:14px 0 22px;font-weight:600}
.hrs span:nth-child(odd){color:var(--mute)}
.cm{display:grid;gap:10px}
footer{background:var(--ink);color:var(--bg);padding:70px 0 110px}
.fg{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:30px;align-items:start}
footer h3{color:var(--accent);font-size:26px}
footer ul{list-style:none;display:grid;gap:6px}
footer a{text-decoration:none}
footer .btn{border-color:var(--accent)}
.built{margin-top:40px;font-size:13px;text-transform:lowercase;opacity:.8}
.bar{display:none}
@media(max-width:1080px){section{padding:80px 0}}
@media(max-width:820px){
nav{display:none;position:absolute;top:66px;left:0;right:0;background:var(--bg);flex-direction:column;padding:16px 20px;border-bottom:2px solid var(--ink)}
nav.open{display:flex}
.burger{display:block;margin-left:auto}
.hb{display:none}
.hg,.ag,.cg,.fg{grid-template-columns:1fr}
.tg{grid-template-columns:1fr 1fr}
.tm{grid-template-columns:1fr}.tm blockquote:nth-child(2){margin-top:0}
.card.big,.card.sm,.card.md{grid-column:span 6}
.hv{max-width:420px;margin:0 8px}
.bar{display:grid;grid-template-columns:1fr 1fr;position:fixed;left:0;right:0;bottom:0;z-index:60;border-top:2px solid var(--ink)}
.bar a{padding:15px;text-align:center;font-weight:800;text-decoration:none}
.bar a:first-child{background:var(--ink);color:var(--accent)}
.bar a:last-child{background:var(--accent)}
}
@media(max-width:520px){section{padding:70px 0}body{font-size:16px}.gal{grid-template-columns:1fr 1fr}.g1,.g4{grid-column:span 2}.g2,.g3{grid-column:span 1}.hrs{grid-template-columns:1fr 1fr}}
</style>
</head>
